services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # порт наружу/на хост НЕ пробрасываем — база доступна только backend'у
    # по внутренней docker-сети

  backend:
    build: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      # только localhost — наружу отдаёт Caddy через reverse_proxy.
      # порт справа поменяй, если 8110 у тебя тоже занят
      - "127.0.0.1:8110:8000"

volumes:
  pgdata:
